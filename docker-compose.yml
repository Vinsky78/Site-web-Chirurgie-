# Base PostgreSQL locale pour le développement (données fictives uniquement).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chirurgie
      POSTGRES_PASSWORD: chirurgie
      POSTGRES_DB: chirurgie
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
